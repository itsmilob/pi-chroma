name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # The 500 MB billion-digit file is too big for the repo, so it lives in a
      # Release and is copied into the site here (server-side, so no CORS).
      # Without the asset the site still deploys with the bundled 1M digits.
      - name: Add billion-digit data from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download data-v1 --pattern pi-1b.pi4 --dir dist; then
            ls -l dist/pi-1b.pi4
          else
            echo "::warning::Release data-v1 / pi-1b.pi4 not found; deploying with 1M digits only"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
